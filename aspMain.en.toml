# RSPRecomp config for the audio microcode of Holy Magic Century (Europe). Run: RSPRecomp aspMain.en.toml
# The text sits at ROM 0x4C340 (VRAM 0x8004B740, loaded by the audio task setup at 0x80024F20).
# Same size as the US microcode; the jump-table targets come from Rainchus/Quest64-Recomp (US)
# and work for this build: audio plays correctly in the scenes tested so far.
text_offset = 0x4C340
text_size = 0xE20
text_address = 0x04001080
rom_file_path = "hmc.en.z64"
output_file_path = "rsp/aspMain.cpp"
output_function_name = "aspMain"

extra_indirect_branch_targets = [
	0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
	0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C
]
