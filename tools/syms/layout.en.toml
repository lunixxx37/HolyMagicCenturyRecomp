# Code sections of Holy Magic Century (Europe), No-Intro SHA1 139607EBA03326FBE9D899663C56E64042D51E84.
# Section names match Quest64Syms (US) so recomp_toolkit.port_funcs can align them.
#
# .main ends where the entry code starts clearing BSS (0x80073630, size 0x239C0).
# bss_size is that BSS; recomp_toolkit.port_data ports the data symbols in it.
# Overlay bounds come from the ROM start/end table built at 0x80031C58.

[[section]]
name = ".entry"
rom = 0x1000
vram = 0x80000400
size = 0x50

[[section]]
name = ".main"
rom = 0x1050
vram = 0x80000450
size = 0x731E0
bss_size = 0x239C0

[[section]]
name = ".ovl_title"
rom = 0xDA7090
vram = 0x80100000
size = 0x1B8A0

[[section]]
name = ".ovl_intro"
rom = 0xDC2930
vram = 0x80100000
size = 0x65970

[[section]]
name = ".ovl_ending"
rom = 0xE282A0
vram = 0x80100000
size = 0x4DA30
